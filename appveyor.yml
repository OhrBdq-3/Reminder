image: Visual Studio 2022
stack: python 3.10

environment:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

install:
  - python --version
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

build_script:
  - chcp 65001
  - >
    flet build windows --verbose
    --pyinstaller-args="
      --collect-all openai
      --collect-all jiter
      --collect-all pydantic_core
      --collect-all typing_inspection
    "

artifacts:
  - path: build\windows
    name: MyReminderApp_Full_Package
    type: zip

image: Visual Studio 2022
stack: python 3.10

environment:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

install:
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

build_script:
  - chcp 65001
  - flet build windows --verbose

artifacts:
  # 关键修改：指向整个文件夹，并指定类型为 zip
  - path: build\windows
    name: MyReminderApp_Full_Package
    type: zip
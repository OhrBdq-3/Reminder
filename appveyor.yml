image: Visual Studio 2022
stack: python 3.10

environment:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1

install:
  - python --version
  - python -m pip install --upgrade pip
  - pip install -r requirements.txt

build_script:
  - chcp 65001
  - set PYINSTALLER_HOOKS_DIR=%CD%\hooks
  - flet build windows --verbose

artifacts:
  - path: build\windows
    name: MyReminderApp_Full_Package
    type: zip
